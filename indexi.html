<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad OCR 雙模式 (掃描+手動)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f5f5f7; margin: 0; padding: 15px; }
        
        #camera-container { 
            position: relative; display: inline-block; width: 100%; max-width: 600px; 
            background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 15px;
        }
        #video { width: 100%; height: auto; display: block; object-fit: contain; }
        
        @media (orientation: portrait) {
            #video { max-height: 40vh; }
        }
        
        #targeting-box {
            position: absolute; top: 50%; left: 50%; width: 280px; height: 70px;
            margin-left: -140px; margin-top: -35px; border: 3px solid #34c759;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); box-sizing: border-box; z-index: 10;
        }
        
        .btn { padding: 12px 24px; border: none; border-radius: 8px; background: #0071e3; color: white; font-weight: bold; width: 100%; font-size: 1.1em; }
        .btn:disabled { background: #ccc; }
        .btn-secondary { background: #34c759; margin-top: 10px;}
        
        #result-panel { margin: 10px 0; padding: 15px; background: #fff; border-radius: 8px; font-size: 1.3em; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        
        /* 手動輸入區塊樣式 */
        #manual-input-section {
            margin: 15px 0; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .input-field {
            width: calc(100% - 30px); padding: 12px; font-size: 1.2em; border: 1px solid #ccc; 
            border-radius: 8px; margin-bottom: 10px; text-align: center; letter-spacing: 2px;
        }
        
        #debug-panel {
            margin-top: 15px; padding: 10px; background: #1e1e1e; color: #00ff00; 
            height: 120px; overflow-y: scroll; text-align: left; font-family: monospace; 
            font-size: 12px; border-radius: 8px; word-break: break-all;
        }
        
        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <button id="start-btn" class="btn" disabled>引擎載入中...</button>
    
    <div id="camera-container" style="display: none;">
        <video id="video" autoplay playsinline muted></video>
        <div id="targeting-box"></div>
    </div>

    <canvas id="hidden-canvas" width="280" height="70"></canvas>
    
    <div id="result-panel">辨識編號: <span id="ocr-result" style="color: #ff3b30;">等待中...</span></div>
    
    <div id="manual-input-section">
        <div style="margin-bottom: 10px; color: #666; font-size: 0.9em;">掃描失敗或過慢？請直接輸入</div>
        <input type="tel" id="manual-input" class="input-field" placeholder="輸入 4-6 位數字" maxlength="6">
        <button id="manual-submit-btn" class="btn btn-secondary">手動確認</button>
    </div>

    <div id="debug-panel">系統啟動中...<br></div>

    <script>
        let worker = null;
        const video = document.getElementById('video');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const RECEIPT_REGEX = /\b\d{4,6}\b/; 
        const EXACT_MATCH_REGEX = /^\d{4,6}$/; // 用於手動輸入的嚴格驗證
        
        let isScanning = false;
        let isProcessing = false;
        let frameCount = 0;

        // --- 音效 (Web Audio API) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        function logDebug(msg) {
            const time = new Date().toLocaleTimeString('en-US', {hour12:false});
            $('#debug-panel').prepend(`[${time}] ${msg}<br>`);
        }

        $(document).ready(async function() {
            try {
                logDebug("開始載入 Tesseract 核心...");
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789', // 既然只有數字，把英文字母拿掉可以加快速度
                });
                logDebug("引擎準備完畢");
                $('#start-btn').text('啟動相機掃描').prop('disabled', false);
            } catch (err) {
                logDebug(`ERROR: 引擎初始化失敗 - ${err.message}`);
            }
        });

        // 啟動相機
        $('#start-btn').click(function() {
            $(this).hide();
            initAudio(); 
            startCamera();
        });

        // --- 新增：處理成功抓取單號的共用邏輯 ---
        function handleSuccess(number, source) {
            isScanning = false; // 停止相機掃描迴圈
            playBeep(); // 播放嗶聲
            
            $('#ocr-result').text(number).css('color', '#34c759');
            $('#start-btn').text('重新掃描').show();
            
            if(source === 'auto') {
                logDebug(`★★★ 相機掃描成功: ${number} ★★★`);
            } else {
                logDebug(`★★★ 手動輸入成功: ${number} ★★★`);
            }

            // 這裡可以觸發將資料送回 Java Struts 後端的邏輯
            // $('#yourFormInput').val(number);
            // $('#yourForm').submit();
        }

        // --- 新增：手動輸入按鈕事件 ---
        $('#manual-submit-btn').click(function() {
            initAudio(); // 確保直接按手動也能解鎖音效
            const manualValue = $('#manual-input').val().trim();
            
            if (EXACT_MATCH_REGEX.test(manualValue)) {
                handleSuccess(manualValue, 'manual');
                // 輸入成功後可選：清空輸入框或隱藏小鍵盤
                $('#manual-input').blur(); 
            } else {
                alert("請輸入有效的 4 到 6 位數字編號！");
                $('#manual-input').focus();
            }
        });

        async function startCamera() {
            try {
                const constraints = { video: { facingMode: "environment" }, audio: false };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                $('#camera-container').show();
                
                video.onplaying = () => {
                    if (!isScanning) {
                        isScanning = true;
                        scanLoop(); 
                    }
                };
            } catch (err) {
                logDebug(`ERROR: 相機啟動失敗 - ${err.message}`);
            }
        }

        async function scanLoop() {
            if (!isScanning) return;
            if (!isProcessing) {
                await processFrame(); 
            }
            setTimeout(scanLoop, 500); 
        }

        async function processFrame() {
            if (!worker || video.paused || video.videoWidth === 0) return;
            isProcessing = true;
            frameCount++;

            const boxWidth = canvas.width;
            const boxHeight = canvas.height;
            const startX = (video.videoWidth - boxWidth) / 2;
            const startY = (video.videoHeight - boxHeight) / 2;

            ctx.clearRect(0, 0, boxWidth, boxHeight);
            ctx.drawImage(video, startX, startY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/\s+/g, ''); 
                logDebug(`> 看到: "${cleanText}"`);

                const match = cleanText.match(RECEIPT_REGEX);
                if (match) {
                    // 呼叫共用的成功處理函數
                    handleSuccess(match[0], 'auto');
                }
            } catch (err) {
                logDebug(`ERROR: ${err.message}`);
            } finally {
                isProcessing = false; 
            }
        }
    </script>
</body>
</html>
