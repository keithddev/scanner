<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad OCR 實時除錯版</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f5f5f7; margin: 0; padding: 10px; }
        
        #camera-container { 
            position: relative; display: inline-block; width: 100%; max-width: 600px; 
            background: #000; border-radius: 12px; overflow: hidden;
        }
        #video { width: 100%; height: auto; display: block; object-fit: contain; }
        
        @media (orientation: portrait) {
            #video { max-height: 40vh; }
        }
        
        #targeting-box {
            position: absolute; top: 50%; left: 50%; width: 280px; height: 70px;
            margin-left: -140px; margin-top: -35px; border: 3px solid #34c759;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); box-sizing: border-box; z-index: 10;
        }
        
        .btn { padding: 12px 24px; border: none; border-radius: 8px; background: #0071e3; color: white; font-weight: bold; width: 100%; margin-bottom: 10px;}
        .btn:disabled { background: #ccc; }
        
        #result-panel { margin: 10px 0; padding: 15px; background: #fff; border-radius: 8px; font-size: 1.2em; font-weight: bold;}
        
        /* 內建 Debug Console 面板 */
        #debug-panel {
            margin-top: 10px; padding: 10px; background: #1e1e1e; color: #00ff00; 
            height: 150px; overflow-y: scroll; text-align: left; font-family: monospace; 
            font-size: 12px; border-radius: 8px; word-break: break-all;
        }
        
        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <button id="start-btn" class="btn" disabled>引擎載入中...</button>
    
    <div id="camera-container" style="display: none;">
        <video id="video" autoplay playsinline muted></video>
        <div id="targeting-box"></div>
    </div>

    <canvas id="hidden-canvas" width="280" height="70"></canvas>
    
    <div id="result-panel">編號: <span id="ocr-result" style="color: #ff3b30;">等待中...</span></div>
    
    <div id="debug-panel">系統啟動中...<br></div>

    <script>
        let worker = null;
        const video = document.getElementById('video');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // 更改為 4 到 6 位數字
        const RECEIPT_REGEX = /\b\d{4,6}\b/; 
        
        let isScanning = false;
        let isProcessing = false;
        let frameCount = 0;

        // 自定義 Debug 輸出函數
        function logDebug(msg) {
            const time = new Date().toLocaleTimeString('en-US', {hour12:false});
            $('#debug-panel').prepend(`[${time}] ${msg}<br>`);
        }

        $(document).ready(async function() {
            try {
                logDebug("開始載入 Tesseract 核心...");
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                });
                logDebug("引擎準備完畢，等待相機權限");
                $('#start-btn').text('啟動相機掃描').prop('disabled', false);
            } catch (err) {
                logDebug(`ERROR: 引擎初始化失敗 - ${err.message}`);
            }
        });

        $('#start-btn').click(function() {
            $(this).hide();
            startCamera();
        });

        async function startCamera() {
            try {
                logDebug("請求相機權限...");
                const constraints = { video: { facingMode: "environment" }, audio: false };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                $('#camera-container').show();
                
                video.onplaying = () => {
                    logDebug(`影片播放中. 尺寸: ${video.videoWidth}x${video.videoHeight}`);
                    if (!isScanning) {
                        isScanning = true;
                        scanLoop(); 
                    }
                };
            } catch (err) {
                logDebug(`ERROR: 相機啟動失敗 - ${err.name} : ${err.message}`);
            }
        }

        async function scanLoop() {
            if (!isScanning) return;

            if (!isProcessing) {
                await processFrame(); 
            }
            // 間隔 500ms
            setTimeout(scanLoop, 500); 
        }

        async function processFrame() {
            if (!worker || video.paused || video.videoWidth === 0) return;
            
            isProcessing = true;
            frameCount++;

            const boxWidth = canvas.width;
            const boxHeight = canvas.height;
            const startX = (video.videoWidth - boxWidth) / 2;
            const startY = (video.videoHeight - boxHeight) / 2;

            ctx.clearRect(0, 0, boxWidth, boxHeight);
            ctx.drawImage(video, startX, startY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

            try {
                // 標記開始辨識
                logDebug(`Frame #${frameCount}: 開始辨識...`);
                
                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/\s+/g, ''); 
                
                // 【關鍵點】把 OCR 看到的結果印出來，即使是空字串或亂碼
                logDebug(`> 看到文字: "${cleanText}"`);

                const match = cleanText.match(RECEIPT_REGEX);
                if (match) {
                    logDebug(`★★★ 命中正則表達式: ${match[0]} ★★★`);
                    isScanning = false; 
                    $('#ocr-result').text(match[0]).css('color', '#34c759');
                    $('#start-btn').text('重新掃描').show();
                }
            } catch (err) {
                logDebug(`ERROR 辨識錯誤: ${err.message}`);
            } finally {
                isProcessing = false; 
            }
        }
    </script>
</body>
</html>
